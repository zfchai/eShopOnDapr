apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: eshopondapr-pubsub
  namespace: eshop
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
  - name: connectionString
    value: "amqp://rabbitmq:5672"
  - name: durable
    value: false
  - name: deletedWhenUnused
    value: false
  - name: autoAck
    value: false
  - name: reconnectWait
    value: 0
  - name: concurrencyMode
    value: parallel
