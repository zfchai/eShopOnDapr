apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: eshopondapr-statestore
  namespace: eshop
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisUsername
    secretKeyRef:
      name: State.User
      key: State.User
  - name: redisPassword
    secretKeyRef:
      name: State.Password
      key: State.Password
  - name: actorStateStore
    value: "true"
auth:
  secretStore: eshopondapr-secretstore
scopes:
- basket-api
- ordering-api